name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All jobs use Ubuntu 26.04, the same version as Heroku's heroku-26 stack,
# rather than ubuntu-latest, so the version only changes when we change it.
# Change it here when the Heroku stack changes.

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The same database as compose.yaml, which the tests use.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: funding
          POSTGRES_PASSWORD: funding
          POSTGRES_DB: funding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funding"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

  # Builds the container image and checks it starts and passes its health
  # check, using compose.yaml. See "Run it in Docker" in README.md.
  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      GIT_REF: ${{ github.sha }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image and start it
        run: docker compose --profile app up --build --wait --wait-timeout 180

      - name: Show the logs
        if: failure()
        run: docker compose --profile app logs

      - name: Stop it
        if: always()
        run: docker compose --profile app down --volumes

  # Deploys main to Heroku once the tests pass. Run the workflow by hand
  # on main to redeploy without a code change.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: heroku
      url: https://govuk-business-funding-api-701ff32e2a83.herokuapp.com/docs
    concurrency:
      group: deploy-heroku
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: scripts/deploy-heroku.sh
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: govuk-business-funding-api
