version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the Node.js type definitions on the same major version as the
      # Node.js runtime (engines.node in package.json). Upgrade both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the image on the same major version of Node.js as .nvmrc and
      # engines.node in package.json. Upgrade them together.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
